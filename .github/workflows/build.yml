name: Verify and build pilot APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;34.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore persistent PKCS12 signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required signing secret: $name"
              exit 1
            fi
          done
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/injaz-mdm-release.p12"
          test -s "$RUNNER_TEMP/injaz-mdm-release.p12"
          keytool -list -storetype PKCS12 -keystore "$RUNNER_TEMP/injaz-mdm-release.p12" -alias "$KEY_ALIAS" -storepass:env STORE_PASSWORD > /dev/null
      - name: Test, lint and assemble sequentially with persistent signature
        env:
          INJAZ_REQUIRE_SIGNING: 'true'
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/injaz-mdm-release.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon testDebugUnitTest
          gradle --no-daemon lintDebug
          gradle --no-daemon assembleDebug
          gradle --no-daemon testReleaseUnitTest lintRelease assembleRelease
      - name: Print lint diagnostics on failure
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Verify APK signature matches the approved new key
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs app/build/outputs/apk/debug/app-debug.apk)
          printf '%s\n' "$CERT_OUTPUT"
          ACTUAL=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test "$ACTUAL" = '9edb78f38add9eec104a510a5b7995effc1aa6b29c91081f6eb73144cb1aeed4'
      - name: Verify manually installable APK and persistent signature
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          CERT_OUTPUT=$("$APKSIGNER" verify --print-certs "$APK")
          ACTUAL=$(printf '%s\n' "$CERT_OUTPUT" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')
          test "$ACTUAL" = '9edb78f38add9eec104a510a5b7995effc1aa6b29c91081f6eb73144cb1aeed4'
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/release-manifest.txt"
          python3 - "$RUNNER_TEMP/release-manifest.txt" <<'PY'
          import re, sys
          text = open(sys.argv[1]).read()
          for flag in ('testOnly', 'debuggable'):
              matches = re.findall(r'android:' + flag + r'\([^\n]*?=\(type 0x12\)(0x[0-9a-fA-F]+)', text)
              if (flag == 'testOnly' and not matches) or any(int(value, 16) != 0 for value in matches):
                  raise SystemExit('Expected false (or default false for debuggable): ' + flag)
          print('Verified testOnly=false and debuggable=false')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: injaz-mdm-manual-install
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/injaz-mdm-release.p12"
      - uses: actions/upload-artifact@v4
        with:
          name: injaz-mdm-pilot-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: app/build/reports/
  firestore-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --prefix tests --ignore-scripts --no-audit --no-fund
      - name: Test Firebase Firestore and Storage authorization rules locally
        run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore,storage --project demo-mdm "npm --prefix tests test"


  push-functions:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure functions/Dockerfile exists
        run: |
          set -euo pipefail
          if [ ! -f "functions/Dockerfile" ]; then
            if [ -f "functions/Dockerfile.txt" ]; then
              echo "functions/Dockerfile missing, copying from functions/Dockerfile.txt..."
              cp functions/Dockerfile.txt functions/Dockerfile
            else
              echo "::error::Both functions/Dockerfile and functions/Dockerfile.txt are missing!"
              exit 1
            fi
          fi
      - name: Verify required container & inspector assets exist
        run: |
          set -euo pipefail
          for file in functions/Dockerfile functions/bin/apksigner.jar functions/cloudRunInspectorServer.js functions/index.js functions/package.json; do
            if [ ! -f "$file" ]; then
              echo "::error::Missing required inspector asset: $file"
              exit 1
            fi
          done
          echo "All required container assets are present."
      - name: Verify bundled official apksigner.jar
        run: java -jar functions/bin/apksigner.jar --version
      - run: npm ci --prefix functions --ignore-scripts --no-audit --no-fund
      - run: npm --prefix functions test
      - name: Build Inspector Container Image
        run: docker build -t mdm-inspector:test functions/
      - name: Test Inspector Container Startup and Healthz
        run: |
          set -euo pipefail
          CONTAINER_ID=$(docker run -d -p 8080:8080 -e NODE_ENV=production -e FIREBASE_PROJECT_ID=demo-mdm -e STORAGE_BUCKET=demo-mdm.appspot.com mdm-inspector:test)
          sleep 3
          curl -f http://127.0.0.1:8080/healthz
          docker stop "$CONTAINER_ID"
      - name: Verify Inspector Container fails on missing required production env vars
        run: |
          set -euo pipefail
          if docker run --rm -e NODE_ENV=production mdm-inspector:test node -e "require('./firebaseAdmin').initFirebaseAdmin({isCloudRunServer: true, isTestMode: false})"; then
            echo "Expected container to fail when required env vars are missing"
            exit 1
          else
            echo "Container correctly failed closed on missing production env vars."
          fi
      - name: Verify all old and new function exports and Cloud Run inspector load
        env:
          GCLOUD_PROJECT: demo-mdm
          FIREBASE_PROJECT_ID: demo-mdm
          STORAGE_BUCKET: demo-mdm.appspot.com
        run: |
          node -e "
            const f = require('./functions');
            const requiredFns = [
              'registerMdmPush',
              'inspectCompanyApk',
              'getTaskDownloadAuthorization',
              'mdmPolicyChanged',
              'mdmEnrollmentChanged',
              'mdmPushRegistered',
              'mdmKioskChanged',
              'cleanupOldLocationPoints',
              'onCommandCompletedKioskSync',
              'onInventoryUpdatedKioskSync'
            ];
            for (const n of requiredFns) {
              if (typeof f[n] !== 'function') throw new Error('Missing or invalid export: ' + n);
            }
            if (!f._testHelpers || typeof f._testHelpers.executeServerApkInspection !== 'function') {
              throw new Error('Missing _testHelpers');
            }
            const cr = require('./functions/cloudRunInspectorServer');
            if (typeof cr.createInspectorRequestHandler !== 'function') {
              throw new Error('Missing cloudRunInspectorServer handler');
            }
          "
      - uses: actions/upload-artifact@v4
        with:
          name: injaz-mdm-push-server
          path: |
            functions/*.js
            functions/bin/**
            functions/Dockerfile
            functions/Dockerfile.txt
            functions/package*.json
            functions/test/*.js
            firebase.push.json
            PUSH-SETUP.md
          if-no-files-found: error
          retention-days: 14

  admin-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:contract
      - run: npm run build
      - run: npx --yes firebase-tools@13.35.1 emulators:exec --only firestore,storage --project demo-mdm "node --test tests/rules.test.mjs"
      - uses: actions/upload-artifact@v4
        with:
          name: injaz-admin-kiosk
          path: |
            admin-web/dist/
            admin-web/src/
            admin-web/tests/
            admin-web/package*.json
            admin-web/*.rules
            admin-web/firebase.json
            admin-web/index.html
            admin-web/tsconfig.json
            admin-web/vite.config.ts
            KIOSK-PILOT.md
          if-no-files-found: error
